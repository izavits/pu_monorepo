[DATASETS]
SCALED_CARDIO = ../data/scaled_cardio.csv
SCALED_CLIMATE = ../data/scaled_climate.csv
SCALED_COVER = ../data/scaled_cover.csv
SCALED_LETTER = ../data/scaled_letter.csv
SCALED_MAMMOGRAPHY = ../data/scaled_mammography.csv
SCALED_PIECHART = ../data/scaled_piechart2.csv
SCALED_PIZZACUTTER = ../data/scaled_pizzacutter1.csv
SCALED_POKER = ../data/scaled_poker-8-9_vs_5.csv
SCALED_SATELLITE = ../data/scaled_satellite.csv
SCALED_SEGMENT = ../data/scaled_segment0.csv
SCALED_SEISMIC = ../data/scaled_seismic.csv
SCALED_SHUTTLE = ../data/scaled_shuttle.csv
SCALED_THYROID = ../data/scaled_thyroid.csv
SCALED_YEAST = ../data/scaled_yeast.csv

[RUN]
EXPERIMENT = SCALED_SEGMENT
OUTPUT = output
MODEL = xgb_objective
CRITERION = sample_dependent_focal_loss_nnpu
MAX_EPOCHS = 100
PATIENCE = 5
LOG_INTERVAL = 2
SAVE_BEST_MODEL = False
DEVICE = mps
PU_RATIO = 0.75
LABELING_MECHANISM = SAR
NUM_RUNS = 10
LOG_WANDB = False
PRIOR = p
RUN_ALL = True

[LOSS_PARAMS]
ALPHA = 0.096
GAMMA = 1.0
BETA = 0

[RUN_2STEP_AD]
EXPERIMENT = SCALED_THYROID
OUTPUT = output_2step
MODEL = optiforest
DEVICE = mps
PU_RATIO = 0.75
LABELING_MECHANISM = SAR
NUM_RUNS = 10
CLASSIFIER = lgb_objective
CRITERION = focal_loss_npu
ETA = 0.5
MAX_EPOCHS = 100
PATIENCE = 5
LOG_INTERVAL = 2
SAVE_BEST_MODEL = False
RUN_ALL = True
PRIOR = p
